<?xml version="1.0" encoding="UTF-8"?>
<!-- WENCES-MK2 vista de frente (según foto 26/11/2026): marco LDO Bear morado con piezas negras,
     pantalla PiTFT50 arriba a la izquierda, portabobinas con bobina blanca arriba a la derecha,
     extrusor Prusa MK3S+ negro con motor pancake y turbina 5015, guía lineal en X,
     husillos Z, cama MK3 con lámina texturizada -->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="moradoV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e2c96"/>
      <stop offset="0.3" stop-color="#c47ce8"/>
      <stop offset="0.55" stop-color="#9a48c6"/>
      <stop offset="1" stop-color="#5e2382"/>
    </linearGradient>
    <linearGradient id="moradoH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c47ce8"/>
      <stop offset="0.45" stop-color="#9a48c6"/>
      <stop offset="1" stop-color="#5e2382"/>
    </linearGradient>
    <linearGradient id="negro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e3e46"/>
      <stop offset="1" stop-color="#16161a"/>
    </linearGradient>
    <linearGradient id="negroL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18181c"/>
      <stop offset="0.5" stop-color="#3a3a42"/>
      <stop offset="1" stop-color="#18181c"/>
    </linearGradient>
    <linearGradient id="acero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset="0.5" stop-color="#b3b7bf"/>
      <stop offset="1" stop-color="#70747c"/>
    </linearGradient>
    <linearGradient id="husillo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6f5c"/>
      <stop offset="0.5" stop-color="#d8cdb8"/>
      <stop offset="1" stop-color="#6c604f"/>
    </linearGradient>
    <pattern id="rosca" width="5" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="5" y2="2" stroke="#4e4436" stroke-width="0.9"/>
    </pattern>
    <radialGradient id="lamina" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#5a4a30"/>
      <stop offset="0.6" stop-color="#7d6843"/>
      <stop offset="1" stop-color="#94804f"/>
    </radialGradient>
    <pattern id="textura" width="5" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1" r="0.6" fill="#e8d6a8" opacity="0.35"/>
      <circle cx="3.8" cy="3" r="0.55" fill="#2e2414" opacity="0.4"/>
    </pattern>
    <linearGradient id="bobinaBlanca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e9ebef"/>
      <stop offset="1" stop-color="#c4c8cf"/>
    </linearGradient>
    <linearGradient id="carton" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8996e"/>
      <stop offset="0.5" stop-color="#e2c9a2"/>
      <stop offset="1" stop-color="#a88a60"/>
    </linearGradient>
    <linearGradient id="ks" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324f"/>
      <stop offset="1" stop-color="#0c1b2c"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#b56ae0" stop-opacity="0.32"/>
      <stop offset="0.7" stop-color="#9a48c6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#9a48c6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- halo -->
  <circle cx="200" cy="205" r="196" fill="url(#halo)"/>

  <!-- ===== portabobinas y bobina blanca (arriba a la derecha) ===== -->
  <g>
    <!-- soporte negro en L -->
    <path d="M258 150 v-104 q0 -8 8 -8 h14 v112 z" fill="url(#negroL)" stroke="#55555f"/>
    <rect x="252" y="140" width="56" height="10" rx="2" fill="url(#negro)" stroke="#55555f"/>
    <!-- valona trasera -->
    <ellipse cx="346" cy="76" rx="13" ry="66" fill="url(#carton)" stroke="#7a6240"/>
    <!-- filamento enrollado -->
    <path d="M298 22 h48 v108 h-48 z" fill="url(#bobinaBlanca)"/>
    <g stroke="#d3d6dc" stroke-width="0.8">
      <line x1="298" y1="40" x2="346" y2="40"/>
      <line x1="298" y1="58" x2="346" y2="58"/>
      <line x1="298" y1="76" x2="346" y2="76"/>
      <line x1="298" y1="94" x2="346" y2="94"/>
      <line x1="298" y1="112" x2="346" y2="112"/>
    </g>
    <!-- valona delantera con buje -->
    <ellipse cx="296" cy="76" rx="13" ry="66" fill="url(#carton)" stroke="#7a6240"/>
    <ellipse cx="296" cy="76" rx="5" ry="14" fill="#2a2a30"/>
    <!-- eje del soporte -->
    <rect x="276" y="72" width="16" height="8" rx="2" fill="#26262c"/>
  </g>

  <!-- ===== pantalla BTT PiTFT50 con KlipperScreen (arriba a la izquierda) ===== -->
  <g>
    <path d="M100 150 l8 -10 h84 l8 10 z" fill="#1e1e24"/>
    <rect x="88" y="60" width="116" height="84" rx="6" fill="url(#negro)" stroke="#55555f" stroke-width="1.5"/>
    <rect x="95" y="67" width="102" height="70" rx="2" fill="url(#ks)"/>
    <!-- lista de temperaturas -->
    <g>
      <rect x="99" y="73" width="3" height="5" fill="#ff7043"/>
      <rect x="104" y="74" width="30" height="3" rx="1" fill="#8fb3d9"/>
      <rect x="99" y="81" width="3" height="5" fill="#ffb74d"/>
      <rect x="104" y="82" width="30" height="3" rx="1" fill="#8fb3d9"/>
      <rect x="99" y="89" width="3" height="5" fill="#ba68c8"/>
      <rect x="104" y="90" width="30" height="3" rx="1" fill="#8fb3d9"/>
      <rect x="99" y="97" width="3" height="5" fill="#4fc3f7"/>
      <rect x="104" y="98" width="30" height="3" rx="1" fill="#8fb3d9"/>
    </g>
    <!-- gráfica -->
    <rect x="99" y="106" width="44" height="26" fill="#0a1522" stroke="#2c4a6a" stroke-width="0.6"/>
    <path d="M100 124 l6 -9 h8 l3 1 h6 l2 -1 h8 l3 1 h6" fill="none" stroke="#9ccc65" stroke-width="1.2"/>
    <path d="M100 129 l10 -2 h32" fill="none" stroke="#ffb74d" stroke-width="1"/>
    <!-- botones del menú -->
    <g fill="#1f4670" stroke="#3b6fa3" stroke-width="0.6">
      <rect x="148" y="72" width="22" height="19" rx="2"/>
      <rect x="172" y="72" width="22" height="19" rx="2"/>
      <rect x="148" y="94" width="22" height="19" rx="2"/>
      <rect x="172" y="94" width="22" height="19" rx="2"/>
      <rect x="148" y="116" width="22" height="18" rx="2"/>
      <rect x="172" y="116" width="22" height="18" rx="2"/>
    </g>
    <g>
      <circle cx="159" cy="81" r="3.5" fill="#b0bec5"/>
      <circle cx="183" cy="81" r="3.5" fill="#ef5350"/>
      <circle cx="159" cy="103" r="3.5" fill="#ffb74d"/>
      <circle cx="183" cy="103" r="3.5" fill="#b0bec5"/>
      <circle cx="159" cy="125" r="3.5" fill="#64b5f6"/>
      <circle cx="183" cy="125" r="3.5" fill="#42a5f5"/>
    </g>
  </g>

  <!-- ===== husillos Z ===== -->
  <rect x="98" y="166" width="6" height="150" fill="url(#husillo)"/>
  <rect x="98" y="166" width="6" height="150" fill="url(#rosca)"/>
  <rect x="296" y="166" width="6" height="150" fill="url(#husillo)"/>
  <rect x="296" y="166" width="6" height="150" fill="url(#rosca)"/>

  <!-- ===== cama: perfiles Y laterales (perspectiva) ===== -->
  <g stroke="#3e1658" stroke-width="1.2">
    <path d="M70 318 h22 l-20 72 h-26 z" fill="url(#moradoV)"/>
    <path d="M308 318 h22 l24 72 h-26 z" fill="url(#moradoV)"/>
  </g>

  <!-- ===== marco Bear: montantes y travesaño superior ===== -->
  <g stroke="#3e1658" stroke-width="1.5">
    <rect x="70" y="160" width="22" height="160" fill="url(#moradoV)"/>
    <rect x="308" y="160" width="22" height="160" fill="url(#moradoV)"/>
    <rect x="70" y="150" width="260" height="22" fill="url(#moradoH)"/>
  </g>
  <g stroke="#4a1a6a" stroke-width="1.6" opacity="0.85">
    <line x1="81" y1="176" x2="81" y2="316"/>
    <line x1="319" y1="176" x2="319" y2="316"/>
    <line x1="104" y1="161" x2="296" y2="161"/>
  </g>
  <!-- esquinas negras superiores -->
  <g fill="url(#negro)" stroke="#55555f">
    <path d="M60 144 h44 v12 h-12 v22 h-32 z"/>
    <path d="M340 144 h-44 v12 h12 v22 h32 z"/>
  </g>
  <!-- placa con el nombre -->
  <rect x="108" y="154" width="84" height="14" rx="3" fill="#141418" stroke="#d9a8f5" stroke-width="0.8"/>
  <text x="150" y="164.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" font-weight="bold"
        fill="#ffffff" text-anchor="middle" letter-spacing="0.8">WENCES MK2</text>

  <!-- ===== soportes de motores Z y motores (negros) ===== -->
  <g fill="url(#negro)" stroke="#55555f">
    <path d="M88 286 h40 v34 h-40 z"/>
    <path d="M272 286 h40 v34 h-40 z"/>
  </g>
  <rect x="96" y="294" width="24" height="3" fill="#5a5a66"/>
  <rect x="280" y="294" width="24" height="3" fill="#5a5a66"/>

  <!-- ===== eje X: guía lineal y correa ===== -->
  <rect x="118" y="234" width="164" height="11" rx="1" fill="url(#acero)" stroke="#6a6e76" stroke-width="0.6"/>
  <g fill="#4a4e56">
    <circle cx="132" cy="239.5" r="1.8"/><circle cx="150" cy="239.5" r="1.8"/>
    <circle cx="168" cy="239.5" r="1.8"/><circle cx="232" cy="239.5" r="1.8"/>
    <circle cx="250" cy="239.5" r="1.8"/><circle cx="268" cy="239.5" r="1.8"/>
  </g>
  <rect x="118" y="249" width="164" height="2.5" fill="#2a2a30"/>
  <rect x="118" y="254" width="164" height="2.5" fill="#2a2a30"/>

  <!-- extremos X negros + tuercas Z -->
  <g fill="url(#negro)" stroke="#55555f">
    <path d="M86 222 h36 v52 h-36 z"/>
    <path d="M278 222 h36 v52 h-36 z"/>
  </g>
  <rect x="94" y="262" width="14" height="9" rx="1.5" fill="#26262c" stroke="#6a6a74"/>
  <rect x="292" y="262" width="14" height="9" rx="1.5" fill="#26262c" stroke="#6a6a74"/>
  <!-- motor X (izquierda) con su tensor -->
  <rect x="58" y="226" width="30" height="36" rx="3" fill="url(#negro)" stroke="#55555f"/>
  <circle cx="73" cy="244" r="4" fill="#9aa0a8"/>

  <!-- ===== filamento blanco desde la bobina al extrusor ===== -->
  <path d="M296 112 C 270 150, 222 170, 206 214" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M296 112 C 270 150, 222 170, 206 214" fill="none" stroke="#b9bec6" stroke-width="0.6" stroke-linecap="round" opacity="0.6"/>

  <!-- ===== extrusor Prusa MK3S+ negro ===== -->
  <g>
    <!-- motor pancake -->
    <rect x="178" y="212" width="46" height="18" rx="3" fill="url(#negro)" stroke="#60606a"/>
    <rect x="186" y="216" width="22" height="9" rx="1" fill="#e6e6ea"/>
    <g fill="#333">
      <rect x="188" y="218" width="16" height="1.2"/>
      <rect x="188" y="221" width="12" height="1.2"/>
    </g>
    <!-- cuerpo -->
    <path d="M176 230 h50 v44 l-6 8 h-38 l-6 -8 z" fill="url(#negro)" stroke="#60606a" stroke-width="1.2"/>
    <!-- tornillo tensor / tapa -->
    <circle cx="188" cy="242" r="3" fill="#8c9098"/>
    <!-- turbina 5015 al frente -->
    <circle cx="211" cy="258" r="13" fill="#1a1a1f" stroke="#6a6a74" stroke-width="1.2"/>
    <circle cx="211" cy="258" r="9" fill="none" stroke="#3c3c46" stroke-width="2.5" stroke-dasharray="2 2"/>
    <circle cx="211" cy="258" r="4" fill="#2c2c34" stroke="#70707a"/>
    <!-- conducto de capa gris (hexágonos) -->
    <path d="M182 282 h38 l-4 14 h-30 z" fill="#4a4a52" stroke="#6a6a74"/>
    <g fill="none" stroke="#6e6e78" stroke-width="0.7">
      <path d="M190 286 l3 -2 l3 2 v3 l-3 2 l-3 -2 z"/>
      <path d="M199 286 l3 -2 l3 2 v3 l-3 2 l-3 -2 z"/>
      <path d="M208 286 l3 -2 l3 2 v3 l-3 2 l-3 -2 z"/>
    </g>
    <!-- boquilla -->
    <path d="M198 296 h6 l-2 4 h-2 z" fill="#c8a050"/>
  </g>

  <!-- ===== lámina texturizada (perspectiva) ===== -->
  <path d="M116 300 L284 300 L322 392 L78 392 Z" fill="url(#lamina)" stroke="#4a3b22" stroke-width="1"/>
  <path d="M116 300 L284 300 L322 392 L78 392 Z" fill="url(#textura)"/>
  <!-- borde frontal de la lámina con su pestaña -->
  <rect x="78" y="390" width="244" height="5" rx="1" fill="#2a2418"/>
  <rect x="186" y="392" width="28" height="5" rx="1" fill="#3a3020"/>

  <!-- patas delanteras negras -->
  <g fill="url(#negro)" stroke="#55555f">
    <path d="M30 380 q0 -10 10 -10 h30 l-4 26 h-36 z"/>
    <path d="M370 380 q0 -10 -10 -10 h-30 l4 26 h36 z"/>
  </g>
  <ellipse cx="48" cy="384" rx="5" ry="6" fill="#0e0e12"/>
  <ellipse cx="352" cy="384" rx="5" ry="6" fill="#0e0e12"/>
</svg>
